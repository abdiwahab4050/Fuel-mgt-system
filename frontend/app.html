<!-- DOCTYPE & HTML ROOT: Document type and root element with language attribute -->
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- HEAD META: Page charset, viewport, and browser tab title -->
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Star Fuel Station - Dashboard</title>
  <!-- EXTERNAL CDN LINKS: Tailwind CSS and Google Fonts (Inter, Geist, Material Symbols) -->
  <!-- Tailwind is prebuilt: run "npm run build:css" in frontend/ after changing classes -->
  <link rel="stylesheet" href="css/tailwind-app.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <!-- CUSTOM STYLESHEET: Project-wide CSS from css/styles.css -->
  <link rel="stylesheet" href="css/styles.css"/>
  
</head>
<!-- BODY: Dashboard shell with background, typography, and overflow settings -->
<body class="bg-background text-on-background font-body-md overflow-x-hidden">

  <!-- SIDEBAR OVERLAY: Mobile backdrop when sidebar is open -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- SIDEBAR: Brand, navigation links (populated by JS), and profile footer -->
  <aside id="sidebar" class="sidebar fixed left-0 top-0 h-full w-[280px] max-w-[85vw] bg-primary-container z-50 border-r border-outline-variant flex flex-col">
    <div class="px-6 py-6 flex items-start justify-between gap-2">
      <div class="min-w-0">
        <h1 id="brand-name" class="text-headline-md font-headline-md font-bold text-on-primary truncate">Star Fuel Station</h1>
        <p class="text-label-sm font-label-sm text-on-primary-container/60 mt-1">Enterprise Resource Planning</p>
      </div>
      <button id="sidebar-close" type="button" class="lg:hidden shrink-0 material-symbols-outlined text-on-primary-container/70 hover:text-on-primary p-1" aria-label="Close menu">close</button>
    </div>
    <nav id="sidebar-nav" class="flex-1 px-2 space-y-1 overflow-y-auto custom-scrollbar min-h-0"></nav>
    <div class="sidebar-footer px-2 py-4 lg:py-6 border-t border-outline-variant/30 shrink-0">
      <a href="#settings" id="profile-link" class="flex items-center gap-3 px-4 py-3 text-on-primary-container/70 hover:text-on-primary-container hover:bg-surface-container-high/20 transition-colors rounded-lg">
        <span class="material-symbols-outlined">account_circle</span>
        <span class="text-body-md">Profile</span>
      </a>
    </div>
  </aside>

  <!-- HEADER: Menu toggle, page title, desktop search, notifications, theme, logout, avatar -->
  <header class="top-header fixed top-0 left-0 lg:left-[280px] right-0 h-14 sm:h-16 bg-surface z-40 flex justify-between items-center px-3 sm:px-6 border-b border-outline-variant">
    <div class="flex items-center gap-2 sm:gap-4 min-w-0 flex-1">
      <button id="menu-toggle" type="button" class="lg:hidden shrink-0 material-symbols-outlined text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full" aria-label="Open menu">menu</button>
      <span id="page-title" class="text-base sm:text-headline-md font-headline-md font-extrabold text-primary truncate">Dashboard Overview</span>
      <div id="search-desktop" class="ml-4 relative hidden lg:block">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">search</span>
        <input id="global-search" class="pl-10 pr-4 py-2 bg-surface-container-low border border-outline-variant rounded-full text-body-md focus:ring-1 focus:ring-secondary focus:border-secondary outline-none w-64" placeholder="Search operations, assets..." type="text"/>
      </div>
    </div>
    <div class="flex items-center gap-1 sm:gap-4 shrink-0">
      <button id="search-toggle" type="button" class="lg:hidden material-symbols-outlined text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full" aria-label="Search">search</button>
      <div class="relative">
        <button id="notif-btn" class="relative material-symbols-outlined text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-colors">notifications</button>
        <span id="notif-badge" class="absolute -top-1 -right-1 w-5 h-5 bg-error text-on-error text-[10px] font-bold rounded-full items-center justify-center hidden">0</span>
        <div id="notif-dropdown" class="notif-dropdown"></div>
      </div>
      <button id="theme-toggle" type="button" class="material-symbols-outlined text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-colors" aria-label="Toggle theme">contrast</button>
      <button type="button" id="header-logout-btn" class="flex items-center gap-1.5 px-2 sm:px-3 py-1.5 text-sm font-semibold text-error border border-error/30 rounded-lg hover:bg-error-container transition-colors" aria-label="Logout">
        <span class="material-symbols-outlined text-lg">logout</span>
        <span class="hidden md:inline">Logout</span>
      </button>
      <button type="button" id="user-avatar-btn" class="h-8 w-8 rounded-full overflow-hidden bg-secondary flex items-center justify-center shrink-0 cursor-pointer hover:ring-2 hover:ring-secondary/40 transition-shadow" title="Edit profile picture" aria-label="Edit profile picture">
        <img id="user-avatar-img" class="hidden h-full w-full object-cover" alt="Profile picture"/>
        <span id="user-avatar" class="text-on-secondary text-sm font-bold">A</span>
      </button>
    </div>
  </header>

  <!-- MOBILE SEARCH: Collapsible search bar shown below header on small screens -->
  <div id="search-mobile" class="fixed top-14 sm:top-16 left-0 right-0 z-30 bg-surface border-b border-outline-variant p-3 hidden lg:hidden">
    <div class="relative">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">search</span>
      <input id="global-search-mobile" class="w-full pl-10 pr-4 py-2 bg-surface-container-low border border-outline-variant rounded-full text-body-md focus:ring-1 focus:ring-secondary focus:border-secondary outline-none" placeholder="Search operations, assets..." type="text"/>
    </div>
  </div>

  <!-- MAIN CONTENT: Dynamic page area rendered by router (dashboard, inventory, etc.) -->
  <main id="main-content" class="main-content w-full lg:w-[calc(100%-280px)] lg:ml-[280px] mt-14 sm:mt-16 p-3 sm:p-4 md:p-8 pb-[5.5rem] lg:pb-8 max-w-[1600px] min-h-[calc(100vh-3.5rem)]"></main>

  <!-- MOBILE NAV: Bottom tab bar for navigation on small screens (populated by JS) -->
  <nav id="mobile-bottom-nav" class="mobile-bottom-nav lg:hidden" aria-label="Mobile navigation"></nav>

  <!-- FAB: Floating action button for quick-create actions -->
  <button id="fab-btn" class="fab-btn fixed bottom-[4.75rem] lg:bottom-8 right-4 sm:right-8 w-12 h-12 sm:w-14 sm:h-14 bg-primary text-on-primary rounded-full flex items-center justify-center shadow-lg hover:scale-110 active:scale-95 transition-all z-40">
    <span class="material-symbols-outlined">add</span>
  </button>

  <!-- SCRIPT: store.js - Shared data store and state helpers -->
  <script src="js/store.js"></script>
  <!-- SCRIPT: utils.js - Utility functions used across pages -->
  <script src="js/utils.js"></script>
  <!-- SCRIPT: auth.js - Authentication and session management -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/billing.js"></script>
  <script src="js/payments.js"></script>
  <!-- SCRIPT: dashboard.js - Dashboard overview page module -->
  <script src="js/pages/dashboard.js"></script>
  <!-- SCRIPT: inventory.js - Inventory management page module -->
  <script src="js/pages/inventory.js"></script>
  <script src="js/pages/pumps.js"></script>
  <!-- SCRIPT: suppliers.js - Suppliers page module -->
  <script src="js/pages/suppliers.js"></script>
  <!-- SCRIPT: purchases.js - Purchases page module -->
  <script src="js/pages/purchases.js"></script>
  <!-- SCRIPT: sales.js - Sales page module -->
  <script src="js/pages/sales.js"></script>
  <script src="js/pages/customers.js"></script>
  <script src="js/pages/invoices.js"></script>
  <script src="js/pages/expenses.js"></script>
  <script src="js/pages/finance.js"></script>
  <!-- SCRIPT: vehicles.js - Vehicles page module -->
  <script src="js/pages/vehicles.js"></script>
  <!-- SCRIPT: consumption.js - Fuel consumption page module -->
  <script src="js/pages/consumption.js"></script>
  <!-- SCRIPT: reports.js - Reports page module -->
  <script src="js/pages/reports.js"></script>
  <!-- SCRIPT: users.js - User management page module -->
  <script src="js/pages/users.js"></script>
  <!-- SCRIPT: settings.js - Settings/profile page module -->
  <script src="js/pages/settings.js"></script>
  <!-- SCRIPT: router.js - Client-side routing and page navigation -->
  <script src="js/router.js?v=9"></script>
  <!-- SCRIPT: app.js - Main app bootstrap, sidebar, header, and event wiring -->
  <script src="js/app.js?v=9"></script>
  <!-- FALLBACK ERROR SCRIPT: Show setup instructions if core scripts fail to load -->
  <script>
    if (typeof Router === 'undefined' || typeof Store === 'undefined') {
      document.getElementById('main-content').innerHTML =
        '<div class="page-section p-6"><h2 class="text-error font-bold">Scripts failed to load</h2>' +
        '<p class="mt-2">Start the backend, which also serves this app:</p>' +
        '<pre class="mt-2 p-3 bg-surface-container-low rounded text-sm">cd backend\nnpm run dev</pre>' +
        '<p class="mt-2">Then open <strong>http://localhost:4000</strong> to log in.</p></div>';
    }
  </script>
</body>
</html>
